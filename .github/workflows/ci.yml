name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAG_DEPLOYMENT: local
      # No Ollama daemon in CI. Agent tests fully mock the LLM layer; the
      # end-to-end API test mocks llm.generate only when no daemon answers,
      # so every endpoint still runs for real. No secrets required.
      RAG_AGENT_MODE: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short
